[project]
name = "matta-refinery"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136,<0.137",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.6",
  "google-genai>=1.0",
  "celery>=5.5,<5.6",
  "redis>=5.2,<6",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13",
  "asyncpg>=0.30",
  "psycopg2-binary>=2.9",
  "slack-sdk>=3.27",
  "hubspot-api-client>=11.0",
  "simple-salesforce>=1.12",
  "google-api-python-client>=2.150",
  "google-cloud-tasks>=2.16",
  "google-cloud-secret-manager>=2.20",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "structlog>=24",
  "uvicorn[standard]>=0.32",
  "gevent>=24",
  # Phase 1.7 enrichment
  "requests>=2.31",
  "playwright>=1.42,<1.43",
  "tavily-python>=0.3.3",
  "google-cloud-logging>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-postgresql>=6.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "freezegun>=1.5",
]

[tool.setuptools]
packages = ['apps', 'packages', 'scripts', 'migrations']
